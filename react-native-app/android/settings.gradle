// Locate @react-native/gradle-plugin (may be hoisted or nested under react-native)
def rnGradlePluginDir = [
    '../node_modules/@react-native/gradle-plugin',
    '../node_modules/react-native/node_modules/@react-native/gradle-plugin'
].collect { file(it) }.find { it.exists() }

if (rnGradlePluginDir == null) {
    throw new GradleException("Cannot find @react-native/gradle-plugin. Run 'npm install' first.")
}

pluginManagement {
    includeBuild(rnGradlePluginDir.absolutePath)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id("com.facebook.react.settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}
rootProject.name = 'WisenetPlayer'
include ':app'
includeBuild(rnGradlePluginDir.absolutePath)
