pluginManagement {
    def rnPlugin = [
        file("../node_modules/@react-native/gradle-plugin"),
        file("../node_modules/react-native/node_modules/@react-native/gradle-plugin")
    ].find { it.exists() && new File(it, 'build.gradle.kts').exists() }
    if (rnPlugin) {
        includeBuild(rnPlugin)
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id("com.facebook.react.settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}
rootProject.name = 'WisenetPlayer'
include ':app'

def rnPluginForBuild = [
    file("../node_modules/@react-native/gradle-plugin"),
    file("../node_modules/react-native/node_modules/@react-native/gradle-plugin")
].find { it.exists() }
if (rnPluginForBuild) {
    includeBuild(rnPluginForBuild)
}
