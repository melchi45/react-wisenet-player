name: Build Android APK

on:
  push:
    branches:
      - react-native
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine build type
        id: build_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.build_type }}" == "release" ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Initialize React Native project
        run: |
          npx react-native@0.73.0 init WisenetPlayer \
            --template react-native-template-typescript \
            --skip-install \
            --directory /tmp/rn-build
          echo "React Native project initialized"

      - name: Copy custom source files
        run: |
          # Replace generated src with our source
          rm -rf /tmp/rn-build/src
          cp -r react-native-app/src /tmp/rn-build/
          cp react-native-app/App.tsx /tmp/rn-build/App.tsx
          cp react-native-app/index.js /tmp/rn-build/index.js

      - name: Merge dependencies into package.json
        run: |
          python3 - <<'EOF'
          import json

          with open('react-native-app/package.json') as f:
              our = json.load(f)
          with open('/tmp/rn-build/package.json') as f:
              base = json.load(f)

          # Merge our runtime dependencies into the base project
          base['dependencies'].update(our['dependencies'])

          with open('/tmp/rn-build/package.json', 'w') as f:
              json.dump(base, f, indent=2)

          print("Merged dependencies:")
          for k in our['dependencies']:
              print(f"  {k}: {our['dependencies'][k]}")
          EOF

      - name: Install Node dependencies
        working-directory: /tmp/rn-build
        run: npm install

      - name: Set up Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "ndk;26.1.10909125" 2>&1 | tail -3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > /tmp/rn-build/android/local.properties

      - name: Set up release keystore
        if: steps.build_type.outputs.type == 'release'
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/rn-build/android/app/release.keystore
            cat >> /tmp/rn-build/android/gradle.properties <<'PROPS'
          WISENET_UPLOAD_STORE_FILE=release.keystore
          WISENET_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          WISENET_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          WISENET_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
            echo "Using release keystore from secrets."
          else
            echo "No release keystore in secrets — using debug keystore."
          fi

      - name: Build Debug APK
        if: steps.build_type.outputs.type == 'debug'
        working-directory: /tmp/rn-build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: steps.build_type.outputs.type == 'release'
        working-directory: /tmp/rn-build/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        id: collect_apk
        run: |
          if [[ "${{ steps.build_type.outputs.type }}" == "release" ]]; then
            SRC="/tmp/rn-build/android/app/build/outputs/apk/release/app-release.apk"
            TAG="${{ github.ref_name }}"
            DEST="$GITHUB_WORKSPACE/wisenet-player-${TAG:-release}.apk"
          else
            SRC="/tmp/rn-build/android/app/build/outputs/apk/debug/app-debug.apk"
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            DEST="$GITHUB_WORKSPACE/wisenet-player-debug-${SHA}.apk"
          fi
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $DEST)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect_apk.outputs.apk_name }}
          path: ${{ steps.collect_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wisenet Player ${{ github.ref_name }}
          body: |
            ## Wisenet Player ${{ github.ref_name }}

            ### 설치 방법
            1. `wisenet-player-${{ github.ref_name }}.apk` 다운로드
            2. Android 기기에서 **설정 > 보안 > 출처를 알 수 없는 앱 허용**
            3. APK 파일 실행하여 설치

            ### 요구사항
            - Android 6.0 (API 23) 이상
            - 카메라와 동일 네트워크 또는 UMP 프록시 서버 접근 가능

            ### 변경사항
            ${{ github.event.head_commit.message }}
          files: ${{ steps.collect_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
