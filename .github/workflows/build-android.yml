name: Build Android APK

on:
  push:
    branches:
      - react-native
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: react-native-app
        run: npm install

      - name: Add node_modules/.bin to PATH
        run: echo "$GITHUB_WORKSPACE/react-native-app/node_modules/.bin" >> $GITHUB_PATH

      - name: Determine build type
        id: build_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.build_type }}" == "release" ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Set up Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "ndk;26.1.10909125" 2>&1 | tail -3

      - name: Create local.properties
        working-directory: react-native-app/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up release keystore
        if: steps.build_type.outputs.type == 'release'
        working-directory: react-native-app/android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            cat >> ../gradle.properties <<'PROPS'
          WISENET_UPLOAD_STORE_FILE=release.keystore
          WISENET_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          WISENET_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          WISENET_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
            echo "Using release keystore from secrets."
          else
            echo "No release keystore in secrets — using debug keystore."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x react-native-app/android/gradlew

      - name: Diagnose gradle-plugin npm package
        working-directory: react-native-app
        run: |
          echo "=== Top-level gradle-plugin ==="
          ls node_modules/@react-native/gradle-plugin/ 2>/dev/null || echo "NOT FOUND"
          echo "=== Nested gradle-plugin ==="
          ls "node_modules/react-native/node_modules/@react-native/gradle-plugin/" 2>/dev/null || echo "NOT FOUND"
          echo "=== build.gradle.kts exists? ==="
          [ -f node_modules/@react-native/gradle-plugin/build.gradle.kts ] && echo "YES (top-level)" || true
          [ -f "node_modules/react-native/node_modules/@react-native/gradle-plugin/build.gradle.kts" ] && echo "YES (nested)" || true
          echo "=== src/ exists? ==="
          ls node_modules/@react-native/gradle-plugin/src/ 2>/dev/null || echo "NO src/ at top-level"
          ls "node_modules/react-native/node_modules/@react-native/gradle-plugin/src/" 2>/dev/null || echo "NO src/ nested"
          echo "=== react-native CLI ==="
          react-native --version 2>/dev/null || echo "NOT FOUND"

      - name: Ensure @react-native/gradle-plugin at top level
        working-directory: react-native-app
        run: |
          PLUGIN_DIR="node_modules/@react-native/gradle-plugin"
          if [ -d "$PLUGIN_DIR" ] && [ -f "$PLUGIN_DIR/build.gradle.kts" ]; then
            echo "Plugin OK at top level"
          else
            NESTED="node_modules/react-native/node_modules/@react-native/gradle-plugin"
            if [ -d "$NESTED" ] && [ -f "$NESTED/build.gradle.kts" ]; then
              mkdir -p "node_modules/@react-native"
              cp -r "$NESTED" "$PLUGIN_DIR"
              echo "Copied from nested location"
            else
              echo "Downloading @react-native/gradle-plugin@0.73.0 from npm registry..."
              npm pack @react-native/gradle-plugin@0.73.0 --pack-destination /tmp/
              mkdir -p "$PLUGIN_DIR"
              tar -xzf /tmp/react-native-gradle-plugin-0.73.0.tgz \
                -C "$PLUGIN_DIR" --strip-components=1
              echo "Extracted from npm pack"
            fi
          fi
          echo "=== Final plugin contents ==="
          ls "$PLUGIN_DIR/"
          echo "=== src/ directory ==="
          ls "$PLUGIN_DIR/src/main/kotlin/com/facebook/react/" 2>/dev/null || echo "No src/"

      - name: Pre-build @react-native/gradle-plugin JAR
        working-directory: react-native-app/node_modules/@react-native/gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon --stacktrace 2>&1 | tail -30
          echo "=== Built JARs ==="
          ls -la build/libs/ || echo "No build/libs/ found"

      - name: Patch settings.gradle to bypass includeBuild plugin resolution
        run: |
          JAR_DIR="${GITHUB_WORKSPACE}/react-native-app/node_modules/@react-native/gradle-plugin/build/libs"
          echo "=== JARs available: ==="
          ls -la "${JAR_DIR}" || echo "WARNING: JAR dir not found"
          echo "" \
            | base64 --decode > react-native-app/android/settings.gradle
          sed -i "s|JAR_DIR_PLACEHOLDER|${JAR_DIR}|g" react-native-app/android/settings.gradle
          echo "=== Patched settings.gradle ==="
          cat react-native-app/android/settings.gradle

      - name: Build Debug APK
        if: steps.build_type.outputs.type == 'debug'
        working-directory: react-native-app/android
        run: |
          ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Build Release APK
        if: steps.build_type.outputs.type == 'release'
        working-directory: react-native-app/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Print build error summary
        if: failure()
        run: |
          echo "========== includeBuild / plugin resolution =========="
          grep -iE "includeBuild|react-native-gradle|Included build|Plugin.*react|Composite" /tmp/gradle-build.log 2>/dev/null | head -30 || echo "(no matches)"
          echo "========== GRADLE ERROR LINES =========="
          grep -E "FAILURE|> Could not|Exception|error:" /tmp/gradle-build.log 2>/dev/null | tail -40 || echo "(no log)"
          echo "========== LAST 80 LINES ==============="
          tail -80 /tmp/gradle-build.log 2>/dev/null || echo "(no log file)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Collect APK
        id: collect_apk
        run: |
          if [[ "${{ steps.build_type.outputs.type }}" == "release" ]]; then
            SRC="react-native-app/android/app/build/outputs/apk/release/app-release.apk"
            TAG="${{ github.ref_name }}"
            DEST="wisenet-player-${TAG:-release}.apk"
          else
            SRC="react-native-app/android/app/build/outputs/apk/debug/app-debug.apk"
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            DEST="wisenet-player-debug-${SHA}.apk"
          fi
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $DEST)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect_apk.outputs.apk_name }}
          path: ${{ steps.collect_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wisenet Player ${{ github.ref_name }}
          body: |
            ## Wisenet Player ${{ github.ref_name }}

            ### 설치 방법
            1. `wisenet-player-${{ github.ref_name }}.apk` 다운로드
            2. Android 기기에서 **설정 > 보안 > 출처를 알 수 없는 앱 허용**
            3. APK 파일 실행하여 설치

            ### 요구사항
            - Android 6.0 (API 23) 이상
            - 카메라와 동일 네트워크 또는 UMP 프록시 서버 접근 가능

            ### 변경사항
            ${{ github.event.head_commit.message }}
          files: ${{ steps.collect_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
